[workspace]
resolver = "2"
members = ["cli", "core", "frontend", "shared", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
font-converter-core = { path = "core" }
font-converter-shared = { path = "shared" }
