name: Native package validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang pkg-config libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libvulkan-dev libx11-dev libxi-dev libxcb-xkb-dev rpm
          curl -fLsS --retry 3 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimagetool"
          chmod +x "$RUNNER_TEMP/appimagetool"
          echo "APPIMAGETOOL=$RUNNER_TEMP/appimagetool" >> "$GITHUB_ENV"
      - run: cargo build --release --locked
      - run: python3 packaging/package.py --target "$TARGET" --binaries-dir target/release --skip-build
      - name: Inspect native packages
        shell: bash
        run: |
          cd "dist/$TARGET"
          shasum -a 256 -c SHA256SUMS
          if [[ "$RUNNER_OS" == Linux ]]; then
            dpkg-deb -I ./*.deb
            rpm -qip ./*.rpm
            ./*.AppImage --appimage-extract >/dev/null
            test -x squashfs-root/AppRun
            mv squashfs-root "$RUNNER_TEMP/appimage"
          else
            hdiutil verify ./*.dmg
            m="$RUNNER_TEMP/font-volume"
            hdiutil attach -readonly -nobrowse -mountpoint "$m" ./*.dmg
            codesign --verify --deep --strict "$m/Font Converter.app"
            hdiutil detach "$m"
            ditto -x -k ./*-app.zip "$RUNNER_TEMP/from-zip"
            codesign --verify --strict "$RUNNER_TEMP/from-zip/Font Converter.app"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          retention-days: 5
      - run: cargo test --locked -p font-converter-engine -p font-converter-cli -p font-converter

  interact:
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Fetch packaged binaries of the verified GPUI source
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}
          path: ${{ runner.temp }}/packages
      - run: |
          cd "$RUNNER_TEMP/packages"
          shasum -a 256 -c SHA256SUMS
          tar xzf ./*-cli.tar.gz
          echo "CLI=$PWD/font-converter-cli/font-converter-cli" >> "$GITHUB_ENV"
      - name: Packaged CLI batch and interrupt
        run: python3 qa/verify.py cli "$CLI"
      - if: runner.os == 'Linux' && !cancelled()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb xauth openbox xdotool python3-gi gir1.2-gtk-3.0 imagemagick libxkbcommon-x11-0 mesa-vulkan-drivers
          cd "$RUNNER_TEMP/packages"
          sudo dpkg -i ./*.deb || sudo apt-get -fy install
          echo "GUI=$(command -v font-converter)" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS' && !cancelled()
        run: |
          mkdir -p "$RUNNER_TEMP/native-workflows"
          clang -fobjc-arc -framework Cocoa -framework ApplicationServices -framework Metal qa/mac.m -o "$RUNNER_TEMP/native-workflows/driver"
          m="$RUNNER_TEMP/font-volume"
          hdiutil attach -readonly -nobrowse -mountpoint "$m" "$RUNNER_TEMP"/packages/*.dmg
          ditto "$m/Font Converter.app" "$RUNNER_TEMP/Font Converter.app"
          hdiutil detach "$m"
          echo "GUI=$RUNNER_TEMP/Font Converter.app/Contents/MacOS/font-converter" >> "$GITHUB_ENV"
      - name: Native OS file drop (no startup paths)
        if: '!cancelled()'
        run: bash qa/run.sh drop
      - name: Native mixed batch (startup paths)
        if: '!cancelled()'
        run: bash qa/run.sh batch
      - name: Native mid-batch cancellation
        if: '!cancelled()'
        run: bash qa/run.sh cancel
      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: diagnostics-${{ matrix.target }}
          path: |
            ${{ runner.temp }}/native-workflows/*.png
            ${{ runner.temp }}/native-workflows/*.log
          if-no-files-found: ignore
          retention-days: 5

  wayland:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with:
          name: x86_64-unknown-linux-gnu
          path: ${{ runner.temp }}/packages
      - run: |
          cd "$RUNNER_TEMP/packages"
          shasum -a 256 -c SHA256SUMS
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract >/dev/null
          echo "GUI=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y sway grim xdotool x11-utils xvfb xauth python3-gi gir1.2-gtk-3.0 mesa-vulkan-drivers libxkbcommon-x11-0
      - name: Native Wayland drag, mixed batch and cancellation from AppImage
        run: xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- bash qa/wayland.sh
      - uses: actions/upload-artifact@v4
        if: '!cancelled()'
        with:
          name: wayland-diagnostics
          path: |
            ${{ runner.temp }}/native-workflows/*.log
            ${{ runner.temp }}/native-workflows/*.png
          retention-days: 5
