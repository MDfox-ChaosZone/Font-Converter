name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.85.5
        with:
          tool: trunk

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Download the pinned OFL test font
        run: |
          mkdir -p target/test-fixtures
          curl --fail --location --output target/test-fixtures/Abel-Regular.ttf \
            https://raw.githubusercontent.com/google/fonts/7ff85c87f93ea6cca5f41c69f2e4edcb90240f26/ofl/abel/Abel-Regular.ttf
          curl --fail --location --output target/test-fixtures/SourceCodePro-Regular.otf \
            https://raw.githubusercontent.com/adobe-fonts/source-code-pro/803b7e23ec97ae58b6232ea76519a76d428ba268/OTF/SourceCodePro-Regular.otf

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run native tests
        env:
          FONT_CONVERTER_TEST_FONT: ${{ github.workspace }}/target/test-fixtures/Abel-Regular.ttf
          FONT_CONVERTER_TEST_OTF: ${{ github.workspace }}/target/test-fixtures/SourceCodePro-Regular.otf
        run: cargo test -p font-converter-shared -p font-converter-core -p font-converter-cli -p font-converter

      - name: Run Clippy
        run: cargo clippy -p font-converter-shared -p font-converter-core -p font-converter-cli -p font-converter --all-targets -- -D warnings

      - name: Check the Leptos WebAssembly frontend
        run: cargo check -p font-converter-frontend --target wasm32-unknown-unknown

      - name: Build the static frontend
        run: trunk build --config frontend/Trunk.toml --release

      - name: Build the CLI
        run: cargo build -p font-converter-cli --release

  desktop-build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb,rpm
          - platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2.85.5
        with:
          tool: trunk
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf rpm

      - uses: tauri-apps/tauri-action@v1
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
