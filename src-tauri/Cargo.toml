[package]
name = "fontbridge"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "fontbridge_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "fontbridge"
path = "src/main.rs"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
serde.workspace = true
serde_json.workspace = true
fontbridge-shared.workspace = true
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"

[features]
# Production builds serve the bundled frontend through Tauri's asset protocol.
# The Tauri CLI enables this feature automatically for `tauri build`.
custom-protocol = ["tauri/custom-protocol"]
